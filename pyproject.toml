[build-system]
requires = [
  "hatchling==1.27.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "coveo-recsys"
version = "0.1.0"
description = "Основа воспроизводимой сессионной рекомендательной системы"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "numpy==2.1.3",
  "scipy==1.15.3",
  "pyarrow==19.0.1",
  "lightgbm==4.6.0",
  "jsonschema==4.23.0",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
neural = ["torch==2.6.0"]

[project.scripts]
coveo-recsys = "coveo_recsys.cli:main"

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "hypothesis==6.131.9",
  "mypy==1.15.0",
  "ruff==0.11.7",
  "httpx==0.28.1",
  "build==1.2.2.post1",
  "hatchling==1.27.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/coveo_recsys"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "coveo_recsys/resources/schemas"
"configs" = "coveo_recsys/resources/configs"
"documents/math/coveo_session_recommender_run_manifest.template.json" = "coveo_recsys/resources/manifest.template.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "coveo: требует фактических таблиц Coveo",
  "load: нагрузочные испытания, не часть Э0",
]

[tool.mypy]
python_version = "3.11"
files = ["src/coveo_recsys"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
