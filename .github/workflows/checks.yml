name: Проверки
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
      - run: uv sync --locked --no-extra neural --no-editable
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -m "not coveo and not load"
      - run: uv build --no-build-isolation
      - run: uv run --no-sync coveo-recsys --version
